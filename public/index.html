<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Tagesplan Düren</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2canvas -->
    <script src="https://cdn.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: #1e293b !important; }
            #capture-area { box-shadow: none !important; border: 1px solid #cbd5e1 !important; }
        }
        .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        body { background: #f8fafc; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="text-slate-800 antialiased p-4 md:p-8">

    <div class="max-w-5xl mx-auto space-y-6">
        
        <!-- Header: Clean & Modern -->
        <header class="bg-slate-900 text-white rounded-2xl shadow-xl p-5 flex flex-col md:flex-row justify-between items-center gap-4 no-print border border-slate-800">
            <div class="flex items-center gap-3.5">
                <div class="bg-gradient-to-br from-rose-500 to-rose-700 text-white p-3 rounded-xl shadow-md shadow-rose-900/30 flex items-center justify-center">
                    <i class="fa-solid fa-layer-group text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white">Elite Tagesplan</h1>
                    <p class="text-xs text-slate-400 font-medium">Standort Düren • Einsatzsteuerung</p>
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-2">
                <button onclick="openQuickModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700/80 px-3.5 py-2 rounded-xl text-xs font-medium transition shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-rose-400"></i> Schnell-Eingabe
                </button>
                <button onclick="sendGroupWhatsApp()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-2 rounded-xl text-xs font-medium transition shadow-sm shadow-emerald-900/20 flex items-center gap-2">
                    <i class="fa-brands fa-whatsapp text-sm"></i> Senden
                </button>
                <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700/80 px-3.5 py-2 rounded-xl text-xs font-medium transition shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-print"></i> Drucken
                </button>
                <button onclick="openModal()" class="bg-rose-600 hover:bg-rose-500 text-white px-4 py-2 rounded-xl text-xs font-semibold transition shadow-md shadow-rose-600/20 flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Neuer Eintrag
                </button>
            </div>
        </header>

        <!-- Wochentage Leiste -->
        <div class="flex overflow-x-auto gap-2 no-print custom-scroll pb-1" id="day-tabs"></div>

        <!-- Haupt-Tabelle Container -->
        <main id="capture-area" class="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200/80">
            
            <!-- Tabellen-Titel -->
            <div class="bg-slate-900 text-white py-4 px-6 flex justify-between items-center border-b border-slate-800">
                <div class="flex items-center gap-3">
                    <span class="w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse"></span>
                    <span id="current-date-title" class="font-bold text-base md:text-lg tracking-wide text-white">Laden...</span>
                </div>
                <span id="day-badge" class="text-[11px] bg-slate-800 text-slate-300 px-3 py-1 rounded-lg uppercase tracking-wider font-semibold border border-slate-700">-</span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 uppercase text-[11px] tracking-wider border-b border-slate-200 font-semibold">
                            <th class="py-3 px-4 text-center w-16">Nr</th>
                            <th class="py-3 px-4 text-center w-32">Abteilung</th>
                            <th class="py-3 px-4">Fahrer / Beifahrer</th>
                            <th class="py-3 px-4 w-32">Zeit</th>
                            <th class="py-3 px-4">Information</th>
                            <th class="py-3 px-4 text-center w-20 no-print">Aktion</th>
                        </tr>
                    </thead>
                    <tbody id="schedule-table-body" class="text-xs divide-y divide-slate-100">
                        <!-- Dynamisch -->
                    </tbody>
                </table>
            </div>

            <!-- Rufumleitung Footer -->
            <div class="bg-slate-50 p-4 border-t border-slate-200 flex items-center justify-between">
                <div class="flex items-center gap-3 w-full max-w-md">
                    <span class="text-xs font-semibold text-slate-500 whitespace-nowrap"><i class="fa-solid fa-phone-volume text-rose-600 mr-1.5"></i> Rufumleitung:</span>
                    <input type="text" id="rufumleitung-input" onchange="updateRufumleitung(this.value)" class="bg-white text-slate-800 border border-slate-300 rounded-xl px-3.5 py-1.5 font-semibold text-xs w-full focus:outline-none focus:border-rose-500 shadow-sm" placeholder="Name eingeben...">
                </div>
            </div>

        </main>
    </div>

    <!-- Modals -->
    <div id="entry-modal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50 no-print">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-100">
            <div class="bg-slate-900 text-white px-5 py-4 flex justify-between items-center">
                <h3 id="modal-title" class="font-bold text-sm text-white">Eintrag</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="entry-form" onsubmit="saveEntry(event)" class="p-5 space-y-4">
                <input type="hidden" id="entry-id">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-500 uppercase mb-1">Nummer (NR)</label>
                        <input type="text" id="input-nr" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold focus:outline-none focus:border-rose-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-500 uppercase mb-1">Abteilung</label>
                        <input type="text" id="input-dept" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold uppercase focus:outline-none focus:border-rose-500">
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-500 uppercase mb-1">Fahrer / Beifahrer</label>
                    <input type="text" id="input-driver" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold focus:outline-none focus:border-rose-500">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-500 uppercase mb-1">Zeit</label>
                    <input type="text" id="input-time" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold focus:outline-none focus:border-rose-500">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-500 uppercase mb-1">Information</label>
                    <input type="text" id="input-info" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold focus:outline-none focus:border-rose-500">
                </div>
                <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-slate-500 hover:text-slate-800 text-xs font-medium">Abbrechen</button>
                    <button type="submit" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-xs font-semibold transition shadow-sm">Speichern</button>
                </div>
            </form>
        </div>
    </div>

    <div id="quick-modal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50 no-print">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl overflow-hidden border border-slate-100 flex flex-col max-h-[85vh]">
            <div class="bg-slate-900 text-white px-5 py-4 flex justify-between items-center shrink-0">
                <h3 class="font-bold text-sm flex items-center gap-2"><i class="fa-solid fa-list-check text-rose-500"></i> Schnell-Eingabe</h3>
                <button onclick="closeQuickModal()" class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="bg-slate-50 px-5 py-3 border-b border-slate-200 flex items-center justify-between flex-wrap gap-2 shrink-0">
                <span class="text-[11px] font-semibold text-slate-500 uppercase">Wochentag wählen:</span>
                <div id="quick-modal-day-selector" class="flex flex-wrap gap-1.5"></div>
            </div>
            <div class="p-4 space-y-2 overflow-y-auto custom-scroll flex-grow" id="quick-rows-container"></div>
            <div class="p-3 bg-slate-50 border-t border-slate-200 shrink-0">
                <button type="button" onclick="addQuickRow()" class="w-full py-2 border border-dashed border-slate-300 hover:border-rose-500 text-slate-500 hover:text-rose-600 rounded-xl font-medium text-xs transition bg-white">
                    + Zeile hinzufügen
                </button>
            </div>
            <div class="bg-white px-5 py-3.5 border-t border-slate-200 flex justify-between items-center shrink-0">
                <span class="text-xs text-slate-500 font-medium" id="quick-counter">0 Einträge</span>
                <div class="flex gap-2">
                    <button type="button" onclick="closeQuickModal()" class="px-4 py-1.5 text-slate-500 hover:text-slate-800 text-xs font-medium">Abbrechen</button>
                    <button type="button" onclick="saveQuickInput()" class="px-4 py-1.5 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-xs font-semibold shadow-sm transition">Speichern</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        function getWeeklyDays() {
            const now = new Date();
            const currentDayOfWeek = now.getDay(); 
            const distanceToMonday = currentDayOfWeek === 0 ? -6 : 1 - currentDayOfWeek;
            const monday = new Date(now);
            monday.setDate(now.getDate() + distanceToMonday);

            const dayNames = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];
            const dayIds = ['montag', 'dienstag', 'mittwoch', 'donnerstag', 'freitag', 'samstag', 'sonntag'];

            let weekDays = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                weekDays.push({
                    id: dayIds[i],
                    name: dayNames[i],
                    date: `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getFullYear()).slice(-2)}`
                });
            }
            return weekDays;
        }

        const days = getWeeklyDays();
        let currentDayId = getTodayId();
        let quickModalDayId = currentDayId;

        function getTodayId() {
            const jsDay = new Date().getDay();
            const mapping = { 1: 'montag', 2: 'dienstag', 3: 'mittwoch', 4: 'donnerstag', 5: 'freitag', 6: 'samstag', 0: 'sonntag' };
            return mapping[jsDay] || 'montag';
        }

        const templateEntries = [
            { id: 1, nr: '3', dept: 'INNO', driver: 'Ramadhan', time: ':', info: '' },
            { id: 2, nr: '5', dept: 'BTW', driver: 'Agenor', time: ':', info: '' },
            { id: 3, nr: '26', dept: 'INNO', driver: 'Patrick', time: ':', info: '' },
            { id: 4, nr: '27', dept: 'INNO', driver: 'Stefan', time: ':', info: '' },
            { id: 5, nr: '30', dept: 'BTW', driver: 'Adrian', time: ':', info: 'ab Büro' },
            { id: 6, nr: '32', dept: 'BTW', driver: 'Norbert', time: ':', info: '' },
            { id: 7, nr: '33', dept: 'BTW', driver: 'Ben', time: ':', info: '' },
            { id: 8, nr: '11', dept: 'INNO', driver: 'Tony', time: ':', info: '' },
            { id: 9, nr: '49', dept: 'INNO', driver: 'Robert / Ugur', time: ':', info: '' },
            { id: 10, nr: '51', dept: 'INNO', driver: 'Bounab', time: ':', info: '' }
        ];

        const defaultData = {};
        days.forEach(d => { defaultData[d.id] = { rufumleitung: 'Sarkar', entries: JSON.parse(JSON.stringify(templateEntries)) }; });

        const storageKey = `elite_tagesplan_v10_${days[0].date}`;
        let appData = JSON.parse(localStorage.getItem(storageKey)) || defaultData;

        function saveData() { localStorage.setItem(storageKey, JSON.stringify(appData)); }

        window.onload = function() { renderTabs(); loadDay(currentDayId); };

        function renderTabs() {
            document.getElementById('day-tabs').innerHTML = days.map(d => `
                <button onclick="switchDay('${d.id}')" class="px-4 py-2 rounded-xl text-xs font-medium transition whitespace-nowrap flex items-center gap-2 border ${currentDayId === d.id ? 'bg-slate-900 text-white border-slate-900 shadow-md' : 'bg-white hover:bg-slate-100 text-slate-600 border-slate-200'}">
                    <span class="font-semibold">${d.name}</span> <span class="text-[10px] opacity-60">${d.date}</span>
                </button>
            `).join('');
        }

        function switchDay(id) { currentDayId = id; renderTabs(); loadDay(id); }

        function loadDay(id) {
            const dayObj = days.find(d => d.id === id);
            document.getElementById('current-date-title').innerText = `${dayObj.name}, den ${dayObj.date}`;
            document.getElementById('day-badge').innerText = dayObj.name;
            document.getElementById('rufumleitung-input').value = appData[id]?.rufumleitung || '';
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('schedule-table-body');
            const entries = appData[currentDayId]?.entries || [];

            if (entries.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-10 text-slate-400 font-medium">Keine Einträge vorhanden.</td></tr>`;
                return;
            }

            tbody.innerHTML = entries.map((e, index) => {
                const deptVal = (e.dept || '').trim().toUpperCase();
                // Dezente, edle Badges statt greller Farbbomben
                const deptBadge = deptVal === 'BTW' 
                    ? 'bg-rose-50 text-rose-700 border border-rose-200/60 font-semibold' 
                    : 'bg-amber-50 text-amber-700 border border-amber-200/60 font-semibold';
                
                return `
                    <tr class="hover:bg-slate-50/80 transition-colors">
                        <td class="py-3 px-4 text-center">
                            <span class="font-bold text-slate-900 text-xs">${e.nr}</span>
                        </td>
                        <td class="py-3 px-4 text-center">
                            <span class="px-2.5 py-1 ${deptBadge} rounded-lg text-[11px] inline-block tracking-wide">${e.dept}</span>
                        </td>
                        <td class="py-3 px-4 font-semibold text-slate-800 text-xs">${e.driver}</td>
                        <td class="py-3 px-4 text-slate-600 font-medium text-xs">${e.time}</td>
                        <td class="py-3 px-4 text-slate-600 text-xs">${e.info || ''}</td>
                        <td class="py-3 px-4 text-center no-print">
                            <button onclick="openModal(${e.id})" class="text-slate-400 hover:text-slate-700 p-1.5 rounded-lg transition" title="Bearbeiten"><i class="fa-solid fa-pen text-xs"></i></button>
                            <button onclick="deleteEntry(${e.id})" class="text-slate-400 hover:text-rose-600 p-1.5 rounded-lg transition ml-1" title="Löschen"><i class="fa-solid fa-trash text-xs"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function updateRufumleitung(val) {
            if (!appData[currentDayId]) appData[currentDayId] = { entries: [] };
            appData[currentDayId].rufumleitung = val;
            saveData();
        }

        function openModal(id = null) {
            document.getElementById('entry-modal').classList.remove('hidden');
            document.getElementById('entry-modal').classList.add('flex');
            if (id) {
                document.getElementById('modal-title').innerText = 'Eintrag bearbeiten';
                const entry = appData[currentDayId].entries.find(e => e.id === id);
                document.getElementById('entry-id').value = entry.id;
                document.getElementById('input-nr').value = entry.nr;
                document.getElementById('input-dept').value = entry.dept;
                document.getElementById('input-driver').value = entry.driver;
                document.getElementById('input-time').value = entry.time;
                document.getElementById('input-info').value = entry.info;
            } else {
                document.getElementById('modal-title').innerText = 'Neuen Eintrag erstellen';
                document.getElementById('entry-form').reset();
                document.getElementById('entry-id').value = '';
                document.getElementById('input-time').value = ':';
            }
        }

        function closeModal() {
            document.getElementById('entry-modal').classList.remove('flex');
            document.getElementById('entry-modal').classList.add('hidden');
        }

        function saveEntry(e) {
            e.preventDefault();
            const id = document.getElementById('entry-id').value;
            const data = {
                id: id ? parseInt(id) : Date.now(),
                nr: document.getElementById('input-nr').value,
                dept: document.getElementById('input-dept').value.toUpperCase(),
                driver: document.getElementById('input-driver').value,
                time: document.getElementById('input-time').value,
                info: document.getElementById('input-info').value
            };
            if (!appData[currentDayId]) appData[currentDayId] = { entries: [], rufumleitung: '' };
            if (id) {
                const idx = appData[currentDayId].entries.findIndex(en => en.id === parseInt(id));
                if (idx !== -1) appData[currentDayId].entries[idx] = data;
            } else {
                appData[currentDayId].entries.push(data);
            }
            saveData(); closeModal(); renderTable();
        }

        function deleteEntry(id) {
            if (confirm('Eintrag wirklich löschen?')) {
                appData[currentDayId].entries = appData[currentDayId].entries.filter(e => e.id !== id);
                saveData(); renderTable();
            }
        }

        function openQuickModal() {
            document.getElementById('quick-modal').classList.remove('hidden');
            document.getElementById('quick-modal').classList.add('flex');
            quickModalDayId = currentDayId;
            renderQuickModalDays(); renderQuickRows();
        }

        function closeQuickModal() {
            document.getElementById('quick-modal').classList.remove('flex');
            document.getElementById('quick-modal').classList.add('hidden');
        }

        function renderQuickModalDays() {
            document.getElementById('quick-modal-day-selector').innerHTML = days.map(d => `
                <button type="button" onclick="quickModalDayId='${d.id}';renderQuickModalDays();renderQuickRows();" class="px-3 py-1 rounded-lg text-xs font-medium transition ${quickModalDayId === d.id ? 'bg-slate-900 text-white shadow-sm' : 'bg-white text-slate-600 border border-slate-200'}">
                    ${d.name}
                </button>
            `).join('');
        }

        function renderQuickRows() {
            const entries = appData[quickModalDayId]?.entries || [];
            document.getElementById('quick-rows-container').innerHTML = entries.map(e => `
                <div class="quick-row-item bg-slate-50 p-2.5 rounded-xl border border-slate-200 grid grid-cols-1 md:grid-cols-12 gap-2 items-center">
                    <input type="text" class="q-nr col-span-2 bg-white text-slate-900 font-semibold px-3 py-1.5 text-xs rounded-lg border border-slate-200 text-center" value="${e.nr || ''}">
                    <input type="text" class="q-dept col-span-2 bg-white text-slate-900 font-semibold px-3 py-1.5 text-xs rounded-lg border border-slate-200 text-center uppercase" value="${e.dept || ''}">
                    <input type="text" class="q-driver col-span-3 bg-white text-slate-900 px-3 py-1.5 text-xs rounded-lg border border-slate-200 font-medium" value="${e.driver || ''}">
                    <input type="text" class="q-time col-span-2 bg-white text-slate-900 px-3 py-1.5 text-xs rounded-lg border border-slate-200 text-center" value="${e.time || ':'}">
                    <input type="text" class="q-info col-span-2 bg-white text-slate-900 px-3 py-1.5 text-xs rounded-lg border border-slate-200 font-medium" value="${e.info || ''}">
                    <button type="button" onclick="this.closest('.quick-row-item').remove(); document.getElementById('quick-counter').innerText = document.querySelectorAll('.quick-row-item').length + ' Einträge';" class="col-span-1 text-slate-400 hover:text-rose-600 text-center p-1"><i class="fa-solid fa-trash-can text-xs"></i></button>
                </div>
            `).join('');
            document.getElementById('quick-counter').innerText = `${entries.length} Einträge`;
        }

        function addQuickRow() {
            if (!appData[quickModalDayId]) appData[quickModalDayId] = { entries: [], rufumleitung: '' };
            appData[quickModalDayId].entries.push({ id: Date.now() + Math.random(), nr: '', dept: 'INNO', driver: '', time: ':', info: '' });
            renderQuickRows();
        }

        function saveQuickInput() {
            const rows = document.querySelectorAll('.quick-row-item');
            let newEntries = [];
            rows.forEach((r, i) => {
                newEntries.push({
                    id: Date.now() + i,
                    nr: r.querySelector('.q-nr').value.trim(),
                    dept: r.querySelector('.q-dept').value.trim().toUpperCase(),
                    driver: r.querySelector('.q-driver').value.trim(),
                    time: r.querySelector('.q-time').value.trim() || ':',
                    info: r.querySelector('.q-info').value.trim()
                });
            });
            if (!appData[quickModalDayId]) appData[quickModalDayId] = { rufumleitung: '', entries: [] };
            appData[quickModalDayId].entries = newEntries;
            saveData(); closeQuickModal(); renderTable();
        }

        function sendGroupWhatsApp() {
            const d = days.find(x => x.id === currentDayId);
            const element = document.getElementById('capture-area');

            html2canvas(element, { scale: 2, backgroundColor: '#ffffff' }).then(canvas => {
                const imageURL = canvas.toDataURL('image/png');
                
                const downloadLink = document.createElement('a');
                downloadLink.href = imageURL;
                downloadLink.download = `Tagesplan_${d.name}_${d.date}.png`;
                downloadLink.click();

                const entries = appData[currentDayId]?.entries || [];
                let text = `👑 *ELITE TAGESPLAN DÜREN - ${d.name.toUpperCase()} (${d.date})* 👑\n\n`;
                
                entries.forEach(e => {
                    text += `• *Nr. ${e.nr}* (${e.dept}) | ${e.driver}`;
                    if (e.time && e.time.trim() !== '' && e.time.trim() !== ':') {
                        text += ` | ⏰ ${e.time}`;
                    }
                    if (e.info && e.info.trim() !== '') {
                        text += ` | ℹ️ ${e.info}`;
                    }
                    text += `\n`;
                });
                
                text += `\n📞 *Rufumleitung:* ${appData[currentDayId]?.rufumleitung || 'Keine'}`;
                window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
            }).catch(err => {
                console.error("Screenshot Fehler:", err);
            });
        }
